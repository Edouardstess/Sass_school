events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
    gzip_min_length 1024;

    # SignalR holds a connection open for the life of a kitchen screen. The
    # default 60s read timeout would cut it every minute.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream sted_api {
        server api:8080;
    }

    upstream sted_web {
        server frontend:80;
    }

    server {
        listen 80;
        server_name _;

        add_header X-Content-Type-Options   "nosniff"        always;
        add_header X-Frame-Options          "DENY"           always;
        add_header Referrer-Policy          "no-referrer"    always;
        add_header Permissions-Policy       "camera=(self), microphone=(), geolocation=()" always;

        client_max_body_size 8m;

        location /api/ {
            proxy_pass         http://sted_api;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Correlation ids must survive the hop, or the audit trail breaks
            # exactly where it is most needed.
            proxy_pass_header  X-Correlation-Id;
        }

        location /hubs/ {
            proxy_pass         http://sted_api;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        $connection_upgrade;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            proxy_read_timeout  1h;
            proxy_send_timeout  1h;
            proxy_buffering     off;
        }

        location /health/ {
            proxy_pass http://sted_api;
            access_log off;
        }

        location / {
            proxy_pass       http://sted_web;
            proxy_set_header Host $host;
        }
    }
}
