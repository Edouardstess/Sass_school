name: Backend

on:
  push:
    branches: ["**"]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, gd
          coverage: none
          tools: composer:v2
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Laravel Pint (code style)
        run: vendor/bin/pint --test
      - name: PHPStan (static analysis)
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  test:
    name: Tests (unit, feature, security)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: schoolflow_test
          POSTGRES_USER: schoolflow
          POSTGRES_PASSWORD: schoolflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s
          --health-timeout 5s --health-retries 10
    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: schoolflow_test
      DB_USERNAME: schoolflow
      DB_PASSWORD: schoolflow
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, redis, bcmath, intl, zip, gd
          coverage: xdebug
          tools: composer:v2
      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: backend/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: cp .env.testing.example .env
      - run: php artisan key:generate
      - name: Enable required PostgreSQL extensions
        run: |
          PGPASSWORD=schoolflow psql -h 127.0.0.1 -U schoolflow -d schoolflow_test \
            -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto; CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS pg_trgm; CREATE EXTENSION IF NOT EXISTS unaccent;'
      - run: php artisan migrate --force
      - name: Run the test suite
        run: vendor/bin/pest --colors=always

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - name: Fail on known CVEs in dependencies
        run: composer audit --abandoned=report
