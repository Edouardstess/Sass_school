name: schoolflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-schoolflow}
      POSTGRES_USER: ${DB_USERNAME:-schoolflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-schoolflow}
      # Deterministic collation keeps ORDER BY stable across hosts.
      POSTGRES_INITDB_ARGS: "--locale-provider=icu --icu-locale=en-US"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-schoolflow} -d ${DB_DATABASE:-schoolflow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [schoolflow]

  redis:
    image: redis:7-alpine
    container_name: schoolflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [schoolflow]

  minio:
    image: minio/minio:latest
    container_name: schoolflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-schoolflow}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-schoolflow}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [schoolflow]

  # One-shot job: creates the bucket the application writes to.
  minio-init:
    image: minio/mc:latest
    container_name: schoolflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${AWS_ACCESS_KEY_ID:-schoolflow} ${AWS_SECRET_ACCESS_KEY:-schoolflow} &&
      mc mb --ignore-existing local/${AWS_BUCKET:-schoolflow} &&
      mc anonymous set none local/${AWS_BUCKET:-schoolflow} &&
      echo 'MinIO bucket ready (private, served through signed URLs only)'
      "
    networks: [schoolflow]

  mailpit:
    image: axllent/mailpit:latest
    container_name: schoolflow-mailpit
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
    networks: [schoolflow]

  backend:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: schoolflow-backend
    restart: unless-stopped
    env_file: [.env]
    environment:
      CONTAINER_ROLE: app
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [schoolflow]

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: schoolflow-worker
    restart: unless-stopped
    env_file: [.env]
    environment:
      CONTAINER_ROLE: worker
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      backend: {condition: service_started}
      redis: {condition: service_healthy}
    networks: [schoolflow]

  scheduler:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: development
    container_name: schoolflow-scheduler
    restart: unless-stopped
    env_file: [.env]
    environment:
      CONTAINER_ROLE: scheduler
    volumes:
      - ./backend:/var/www/html
      - backend-vendor:/var/www/html/vendor
    depends_on:
      backend: {condition: service_started}
    networks: [schoolflow]

  nginx:
    image: nginx:1.27-alpine
    container_name: schoolflow-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8000}:80"
    volumes:
      - ./backend:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend: {condition: service_started}
    networks: [schoolflow]

  frontend:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
      target: development
    container_name: schoolflow-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-fr}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-next:/app/.next
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      nginx: {condition: service_started}
    networks: [schoolflow]

volumes:
  postgres-data:
  redis-data:
  minio-data:
  backend-vendor:
  frontend-node-modules:
  frontend-next:

networks:
  schoolflow:
    driver: bridge
